name: Publish

# a v* tag publishes the package to npm with trusted publishing (oidc): no npm token is stored.
# one-time setup on npmjs.com (package soluna, settings, trusted publisher, github actions):
#   user mirageglobe, repository soluna, workflow filename publish.yml, environment npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm # must match the environment name in the npm trusted publisher settings

    permissions:
      id-token: write # lets this job request the oidc token npm trusts
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x' # trusted publishing needs npm 11.5.1+, which node 24 ships
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # no cache in a release job

      # fail early if the runner's npm is too old for oidc publishing
      - name: Check npm version
        run: |
          v="$(npm --version)"
          printf '%s\n%s\n' 11.5.1 "$v" | sort -V -C || { echo "npm $v is too old for trusted publishing (needs 11.5.1+)"; exit 1; }

      # refuse to publish when the tag and package.json disagree
      - name: Check tag matches package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }

      - run: npm ci

      - run: npm test

      # provenance is attached automatically for a public package from a public repo
      - run: npm publish
